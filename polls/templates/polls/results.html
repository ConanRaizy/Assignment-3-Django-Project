{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>

    <link rel="stylesheet" href="{% static 'css/sgustyle.css' %}">
</head>

<body>

<div class="main-card">

    <h2>{{ question.question_text }}</h2>

    <ul class="results-list">
        {% for choice in question.choice_set.all %}
        <li>
            {{ choice.choice_text }} — {{ choice.votes }} vote{{ choice.votes|pluralize }}
        </li>
        {% endfor %}
    </ul>

    <a href="{% url 'polls:index' %}" class="back-btn">Back to Polls</a>

</div>

</body>
</html>
